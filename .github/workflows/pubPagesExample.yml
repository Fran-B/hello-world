# Created from Simple workflow for deploying static content to GitHub Pages
name: Deploy built content to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      doc_dir:
        description: 'Documentation Directory'
        default: 'DOX'
        required: true
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      #doc_dir: ./DOX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout/tags
        uses: actions/checkout@v7
      - name: Create clean documentation directory
        run: |
          mkdir -p ${{inputs.doc_dir}}
          rm -rf ${{inputs.doc_dir}}/*
      - name: Build documentation
        run: ./tools/genDox.sh ${{inputs.doc_dir}}
      - name: Setup Pages
        # see https://github.com/actions/configure-pages/tags
        uses: actions/configure-pages@v6
      - name: Upload artifact
        # see https://github.com/actions/upload-pages-artifact/tags
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire directory
          path: ${{inputs.doc_dir}}
      - name: Deploy to GitHub Pages
        id: deployment
        # see https://github.com/actions/deploy-pages/tags
        uses: actions/deploy-pages@v5
